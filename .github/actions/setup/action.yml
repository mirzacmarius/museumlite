name: Setup
description: >-
  Install Bun (pinned), restore the bun install cache, and run a frozen
  install. Use once after actions/checkout for non-documentation CI changes.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: 1.3.14

    - name: Cache bun install store
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
