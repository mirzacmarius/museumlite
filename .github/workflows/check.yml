name: Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Remote Turborepo cache. If the secrets are unset, GitHub passes empty
# strings and Turbo silently falls back to local-only caching, so this is
# safe to leave on even when the repo doesn't yet have credentials.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Skip @t3-oss/env validation and supply placeholders so `next build`
      # can prerender pages that instantiate ConvexReactClient at build time.
      CI: true
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-store-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔦 Lint
        run: bun run lint

      - name: 🪐 Typecheck
        run: bun run typecheck

      - name: 🌐 Typecheck i18n
        run: bun run typecheck:i18n

      - name: 🧪 Test (backend)
        working-directory: packages/backend
        run: bun run test:once

      - name: 🏗️ Build
        run: bun run build

      - name: 🧑‍💻 React Doctor
        run: bun run react-doctor
