name: Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Remote Turborepo cache. If the secrets are unset, GitHub passes empty
# strings and Turbo silently falls back to local-only caching, so this is
# safe to leave on even when the repo doesn't yet have credentials.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 🔦 Lint
        run: bun run lint
      - name: 🧑‍💻 React Doctor
        run: bun run react-doctor

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
      - name: 🪐 Typecheck
        run: bun run typecheck
      - name: 🌐 Typecheck i18n
        run: bun run typecheck:i18n

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 🧪 Test (backend)
        working-directory: packages/backend
        run: bun run test:once

  build:
    runs-on: ubuntu-latest
    env:
      # Skip @t3-oss/env validation and supply placeholders so `next build`
      # can prerender pages that instantiate ConvexReactClient at build time.
      CI: true
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
      - name: 🏗️ Build
        run: bun run build

  # Aggregator job so branch-protection rules can keep requiring the
  # single status check `Check / check` instead of tracking each parallel
  # job individually.
  check:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    steps:
      - name: Verify all required jobs passed
        run: |
          declare -A results=(
            [lint]="${{ needs.lint.result }}"
            [typecheck]="${{ needs.typecheck.result }}"
            [test]="${{ needs.test.result }}"
            [build]="${{ needs.build.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            echo "${job}: ${results[$job]}"
            if [[ "${results[$job]}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
