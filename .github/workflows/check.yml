name: Check
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Remote Turborepo cache. If the secrets are unset, GitHub passes empty
# strings and Turbo silently falls back to local-only caching, so this is
# safe to leave on even when the repo doesn't yet have credentials.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 🔦 Lint
        run: bun run lint
      - name: 🧑‍💻 React Doctor
        run: bun run react-doctor

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-
      - name: 🪐 Typecheck
        run: bun run typecheck
      - name: 🌐 Typecheck i18n
        run: bun run typecheck:i18n

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 🧪 Test
        run: bun run test

  build:
    runs-on: ubuntu-latest
    env:
      # Skip @t3-oss/env validation and supply placeholders so `next build`
      # can prerender pages that instantiate ConvexReactClient at build time.
      CI: true
      SKIP_ENV_VALIDATION: "true"
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-
      - name: 🏗️ Build
        run: bun run build

  # A real push catches what lint, types and convex-test do not (for example
  # a duplicate schema index), and the seed runs auth and public functions
  # with their validators enforced by the real backend. Targets an isolated
  # loopback backend (scripts/local-qa): never a cloud deployment, no secrets.
  deploy:
    runs-on: ubuntu-latest
    env:
      CONVEX_LOCAL_BACKEND_VERSION: precompiled-2026-10-06-a3538c6
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Convex local backend
        id: backend-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex/binaries/${{ env.CONVEX_LOCAL_BACKEND_VERSION }}
          key: convex-local-backend-${{ runner.os }}-${{ env.CONVEX_LOCAL_BACKEND_VERSION }}
      - name: Download Convex local backend
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: |
          dir="$HOME/.cache/convex/binaries/$CONVEX_LOCAL_BACKEND_VERSION"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/backend.zip" \
            "https://github.com/get-convex/convex-backend/releases/download/$CONVEX_LOCAL_BACKEND_VERSION/convex-local-backend-x86_64-unknown-linux-gnu.zip"
          unzip -o "$RUNNER_TEMP/backend.zip" -d "$dir"
          chmod +x "$dir/convex-local-backend"
      - name: Start loopback Convex backend
        run: |
          export CONVEX_LOCAL_BACKEND_BIN="$HOME/.cache/convex/binaries/$CONVEX_LOCAL_BACKEND_VERSION/convex-local-backend"
          bun run qa:backend
      - name: 🚀 Deploy Convex functions to loopback backend
        # The typecheck job already runs tsc.
        run: bun run convex:local -- deploy --yes --typecheck disable
      - name: 🔑 Seed QA user (auth and public API smoke test)
        run: bun run qa:seed
      - name: Generated Convex code is current
        run: |
          if [ -n "$(git status --porcelain -- packages/backend/convex/_generated)" ]; then
            git diff -- packages/backend/convex/_generated
            echo "::error::packages/backend/convex/_generated is stale. Run bun run codegen:local and commit the result."
            exit 1
          fi
      - name: Backend log
        if: failure()
        run: tail -n 200 .local-qa/backend.log || true

  # Aggregator job so branch-protection rules can keep requiring the
  # single status check `Check / check` instead of tracking each parallel
  # job individually.
  check:
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, deploy]
    steps:
      - name: Verify all required jobs passed
        run: |
          declare -A results=(
            [lint]="${{ needs.lint.result }}"
            [typecheck]="${{ needs.typecheck.result }}"
            [test]="${{ needs.test.result }}"
            [build]="${{ needs.build.result }}"
            [deploy]="${{ needs.deploy.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            echo "${job}: ${results[$job]}"
            if [[ "${results[$job]}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"
